<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100" aria-hidden="true">
  <style>
    .blue{fill:none;stroke:#396f8b;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
